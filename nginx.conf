# ─── AUREN E-Commerce — Nginx Load Balancer Configuration ────────────────────
#
# Architecture:
#   Client → Nginx :80 → round-robin → Backend 1/2/3 → Redis
#
# Backend hostnames are Docker Compose service names (backend1/backend2/backend3).
# For bare-metal deployment, replace with actual IPs/hostnames.

worker_processes auto;

events {
    worker_connections 2048;   # handles 1,000+ concurrent connections
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────────────────────────
    log_format json_log escape=json
        '{"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes":$body_bytes_sent,'
        '"upstream":"$upstream_addr",'
        '"request_time":$request_time}';

    access_log /var/log/nginx/access.log json_log;
    error_log  /var/log/nginx/error.log  warn;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # ── Upstream backend pool ─────────────────────────────────────────────────
    upstream auren_backend {
        # Round-robin (default). Switch to `least_conn` for uneven workloads.
        least_conn;

        server backend1:3000 fail_timeout=10s max_fails=3;
        server backend2:3000 fail_timeout=10s max_fails=3;
        server backend3:3000 fail_timeout=10s max_fails=3;

        keepalive 64;   # persistent upstream connections
    }

    # ── Per-IP rate-limit zone (in addition to Redis distributed limits) ──────
    # This provides a first-line defence at the Nginx level.
    # 10 mb zone ≈ 160,000 IPs tracked.
    limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;

    # ── Server ────────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Forward real client IP
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header Host             $host;

        # Timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # ── Health check (bypass rate limiting) ───────────────────────────────
        location = /api/health {
            proxy_pass http://auren_backend;
        }

        # ── Auth endpoints: apply Nginx-level rate limiting ───────────────────
        location ~* ^/api/auth/(login|register) {
            limit_req zone=login_zone burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://auren_backend;
        }

        # ── All other requests ────────────────────────────────────────────────
        location / {
            proxy_pass http://auren_backend;

            # Required for Next.js streaming / SSE
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
